name: Sync upstream

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/JonanekDev/AdGuardHome-Exporter.git
          git fetch upstream master
          git checkout -B automation/upstream-sync
          git merge --no-ff --no-edit upstream/master

      - name: Detect upstream changes
        id: diff
        run: |
          if git diff --quiet master...HEAD; then
            echo "Upstream is already synchronized."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch
        if: steps.diff.outputs.changed == 'true'
        run: git push --force-with-lease origin HEAD:automation/upstream-sync

      - name: Open or update upstream sync pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list \
            --head automation/upstream-sync \
            --base master \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Pull request #$existing already tracks automation/upstream-sync."
            exit 0
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
            -f head=automation/upstream-sync \
            -f base=master \
            -f title="chore: sync upstream changes" \
            -f body=$'Automated sync from `JonanekDev/AdGuardHome-Exporter:master`.\n\nReview this pull request before merging so fork-specific fixes remain intact.'
