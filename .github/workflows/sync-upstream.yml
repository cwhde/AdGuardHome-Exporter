name: Sync upstream

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/JonanekDev/AdGuardHome-Exporter.git
          git fetch upstream master
          git checkout -B automation/upstream-sync
          git merge --no-ff --no-edit upstream/master

      - name: Simulate upstream change (temporary permission test)
        run: |
          git commit --allow-empty -m "test: simulated upstream change"

      - name: Detect upstream changes
        id: diff
        run: |
          if git diff --quiet master...HEAD; then
            echo "Upstream is already synchronized."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch
        if: steps.diff.outputs.changed == 'true'
        run: git push --force-with-lease origin HEAD:automation/upstream-sync

      - name: Open or update upstream sync pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list \
            --head automation/upstream-sync \
            --base master \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Pull request #$existing already tracks automation/upstream-sync."
            exit 0
          fi
          echo "--- REST attempt ---"
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls" \
            -d '{"head":"automation/upstream-sync","base":"master","title":"chore: sync upstream changes","body":"probe"}' | head -60
